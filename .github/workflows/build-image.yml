name: Build, test and publish the DeGenRESOLVE image

# Builds image/ (validated conda env + DeGenRESOLVE + browser desktop), runs the full
# influenza demo pipeline inside it, checks the output is identical to the v1.0.1 reference
# run, and only then pushes it to ghcr.io for Codespaces to use.
# Public repository: the runner minutes and the public package are free.

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4

      - name: Work out image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          version="$(sed -n 's/^ARG DEGENRESOLVE_TAG=v//p' image/Dockerfile)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Image: ghcr.io/${GITHUB_REPOSITORY,,}:${version}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, run the demo-data self-test, push only if it passes
        uses: devcontainers/ci@v0.3
        with:
          subFolder: image
          imageName: ${{ steps.meta.outputs.image }}
          imageTag: ${{ steps.meta.outputs.version }},latest
          push: filter
          refFilterForPush: refs/heads/main
          # One event per line: a comma-separated value is read as a single event name.
          eventFilterForPush: |
            push
            workflow_dispatch
          runCmd: degenresolve-selftest selftest-run

      - name: Add the self-test result to the run summary
        if: always()
        run: |
          if [ -f image/selftest-run/selftest-summary.md ]; then
            cat image/selftest-run/selftest-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Self-test did not produce a summary - see the build log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the self-test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-outputs
          if-no-files-found: ignore
          path: |
            image/selftest-run/selftest-summary.md
            image/selftest-run/pipeline.log
            image/selftest-run/results/reports/
            image/selftest-run/results/step_7_draft_consensus/
            image/selftest-run/results/step_8_refined_consensus/
            image/selftest-run/log/
